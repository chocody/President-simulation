name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Source checks
        run: pnpm tsx scripts/check-sources.ts
      - name: Build web app
        run: pnpm -C apps/web build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Playwright E2E
        working-directory: apps/web
        run: |
          # The Playwright config reads the browser path from PS_CHROMIUM.
          export PS_CHROMIUM="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm e2e
