id: disaster.flood.major
category: disaster
severity: major
titleTh: "น้ำท่วมใหญ่หลายจังหวัด"
situationTh: "ฝนตกหนักต่อเนื่องหลายสัปดาห์ทำให้แม่น้ำสายหลักล้นตลิ่ง หลายจังหวัดน้ำท่วมสูงจนต้องอพยพประชาชนไปอยู่ศูนย์พักพิงชั่วคราว ถนนสายสำคัญถูกตัดขาด โรงงานและตลาดหลายแห่งหยุดดำเนินการ พื้นที่เกษตรจำนวนมากจมอยู่ใต้น้ำ ทำให้พืชผลก่อนเก็บเกี่ยวเสียหาย รัฐมนตรีคลังรายงานว่างบสำรองมีจำกัด ขณะที่รัฐมนตรีที่ดูแลการปกครองท้องถิ่นแจ้งว่าประชาชนต้องการอาหาร ยารักษาโรค และที่พักอย่างเร่งด่วน สื่อมวลชนจับตาว่ารัฐบาลจะตัดสินใจอย่างไรในสัปดาห์นี้"
conditions: []
baseWeight: 1
cooldownQ: 8
ifIgnored:
  - { target: gdpGrowth, delta: -0.8, over_quarters: 4 }
  - { target: health, delta: -5, over_quarters: 2 }
  - { target: "group:farmers", delta: -8, over_quarters: 4 }
sourceIds: [design.level-scale, paper.kocornik-mina-2020, wdi.NY.GDP.MKTP.KD.ZG]
