    approach: state-led
    titleTh: "จ้างงานฟื้นฟูและซ่อมสร้างโดยรัฐ"
    descTh: "รัฐจ้างคนในพื้นที่ซ่อมถนน คันกั้นน้ำ และระบบระบายน้ำ ได้ทั้งงานและโครงสร้างพื้นฐาน แต่ใช้งบสูงและต้องใช้เวลานาน"
    costHint: L
    affectedGroups: [farmers, urban, youth]
    evidenceIds: [ev.public-works.001]
    judgment: null
    reviewedBy: null
  - id: b
    approach: targeted
    titleTh: "เงินช่วยเหลือเฉพาะครัวเรือนที่เสียหาย"
    descTh: "จ่ายเงินสดให้ครัวเรือนที่ได้รับความเสียหายจริงตามการสำรวจ ช่วยให้ฟื้นตัวเร็วและหมุนเวียนในตลาดท้องถิ่น แต่การสำรวจล่าช้าและผู้ที่ตกสำรวจจะไม่พอใจ"
    costHint: M
    affectedGroups: [farmers, urban]
    evidenceIds: [ev.cash-transfer.001, ev.cash-transfer.002]
    judgment: null
    reviewedBy: null
  - id: c
    approach: market-led
    titleTh: "ให้ตลาดและประกันภัยฟื้นตัวเอง"
    descTh: "รัฐช่วยเพียงสินเชื่อดอกเบี้ยต่ำและเร่งจ่ายประกันภัย ปล่อยให้ธุรกิจฟื้นตัวตามกลไกตลาด ประหยัดงบ แต่ครัวเรือนยากจนและเกษตรกรที่ไม่มีประกันต้องแบกภาระเอง"
    costHint: S
    affectedGroups: [farmers, business, urban]
    evidenceIds: [ev.flood.001]
    judgment: null
    reviewedBy: null
