id: politics.cabinet.scandal
category: politics
severity: major
titleTh: "เรื่องอื้อฉาวในคณะรัฐมนตรี"
situationTh: "สื่อมวลชนเปิดเผยเอกสารที่ชี้ว่ารัฐมนตรีคนหนึ่งในคณะรัฐมนตรีอาจมีส่วนเกี่ยวข้องกับการจัดซื้อจัดจ้างที่ให้ประโยชน์แก่บริษัทของญาติ ฝ่ายค้านเรียกร้องให้ลาออกและขู่ยื่นญัตติอภิปราย ขณะที่รัฐมนตรีปฏิเสธข้อกล่าวหาและอ้างว่าเป็นการโจมตีทางการเมือง ประชาชนในโลกออนไลน์แสดงความโกรธ ผู้สนับสนุนรัฐบาลแบ่งเป็นสองฝ่ายว่าควรปกป้องหรือปล่อยให้มีการตรวจสอบ"
conditions: []   # MVP: every card eligible. State-based weights come in v1 (plan's event table).
baseWeight: 1
cooldownQ: 8
ifIgnored:
  - { target: parliament, delta: -5, over_quarters: 3 }
  - { target: stability, delta: -2, over_quarters: 3 }
  - { target: corruption, delta: 2, over_quarters: 4 }
sourceIds: [design.level-scale, paper.olken-2007, eval.jpal-ferraz-finan, wgi.GOV_WGI_CC_SC]
choices:
  - id: a
    approach: transparency
    titleTh: "ตรวจสอบอิสระและเปิดเผยผลต่อสาธารณะ"
    descTh: "ตั้งคณะตรวจสอบอิสระและประกาศผลทั้งหมดต่อสาธารณะ ความโปร่งใสสร้างความเชื่อมั่นระยะยาว แต่ผู้ที่เกี่ยวข้องจะเสียหายและพันธมิตรทางการเมืองอาจไม่พอใจ"
    costHint: S
    affectedGroups: [urban, business]
    evidenceIds: [ev.disclosure.001]
    judgment: null
    reviewedBy: null
  - id: b
    approach: quiet-reshuffle
    titleTh: "ปรับคณะรัฐมนตรีเงียบ ๆ"
    descTh: "ย้ายรัฐมนตรีไปตำแหน่งอื่นโดยไม่เปิดเผยรายละเอียด ลดแรงกดดันได้ทันที แต่ถ้าข้อมูลรั่วภายหลัง ความน่าเชื่อถือจะเสียหายหนักและสื่อจะตั้งคำถามมากขึ้น"
    costHint: XS
    affectedGroups: [business, military]
    evidenceIds: []
    judgment: null
    reviewedBy: null
  - id: c
    approach: random-audit
    titleTh: "ตรวจสอบสุ่มการจัดซื้อจัดจ้างทุกกระทรวง"
    descTh: "สั่งตรวจสอบสุ่มสัญญาจัดซื้อจัดจ้างในทุกกระทรวงเป็นประจำ ลดการทุจริตในระยะยาวตามหลักฐาน แต่ต้องใช้งบและบุคลากร และข้าราชการจะรู้สึกว่าถูกจับตา"
    costHint: M
    affectedGroups: [business, urban]
    evidenceIds: [ev.audit.001]
    judgment: null
    reviewedBy: null
