id: economy.oil.spike
category: economy
severity: major
titleTh: "ราคาน้ำมันโลกพุ่งสูง"
situationTh: "ราคาน้ำมันในตลาดโลกพุ่งสูงขึ้นอย่างรวดเร็วจากความขัดแย้งในแหล่งผลิต ราคาขายปลีกในประเทศเริ่มขยับตามทำให้ค่าขนส่งและราคาสินค้าจำเป็นปรับขึ้น ผู้ประกอบการขนส่งและเกษตรกรเรียกร้องให้รัฐตรึงราคา ขณะที่รัฐมนตรีคลังเตือนว่ากองทุนน้ำมันเชื้อเพลิงมีเงินจำกัดและหนี้สาธารณะอยู่ในระดับที่ต้องระวัง ประชาชนในเมืองกังวลค่าครองชีพ สื่อถามว่ารัฐบาลจะช่วยใครและจะใช้เงินจากไหน"
conditions: []
