id: health.hospitals.overwhelmed
category: health
severity: major
titleTh: "โรงพยาบาลรัฐแออัดจนรับผู้ป่วยไม่ไหว"
situationTh: "ผู้ป่วยหนักล้นโรงพยาบาลของรัฐในเมืองใหญ่ เตียงผู้ป่วยวิกฤตเต็มและต้องวางเตียงเสริมตามทางเดิน แพทย์และพยาบาลทำงานเกินเวลาติดต่อกันหลายสัปดาห์ บางคนเริ่มลาออก รถพยาบาลต้องรอรับผู้ป่วยนาน ญาติผู้ป่วยร้องเรียนผ่านสื่อ ขณะที่โรงพยาบาลเอกชนยังมีเตียงว่างแต่ค่ารักษาสูง รัฐมนตรีสาธารณสุขขออำนาจตัดสินใจเร่งด่วนเพื่อรองรับสถานการณ์ในสัปดาห์หน้า"
conditions:
