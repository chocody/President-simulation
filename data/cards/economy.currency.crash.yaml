id: economy.currency.crash
category: economy
severity: major
titleTh: "ค่าเงินอ่อนลงอย่างรวดเร็ว"
situationTh: "ค่าเงินของประเทศอ่อนลงอย่างรวดเร็วหลังนักลงทุนต่างชาติถอนเงินออกพร้อมกัน ราคาสินค้านำเข้าทั้งน้ำมัน ปุ๋ย และเครื่องจักรเริ่มแพงขึ้น ผู้ประกอบการที่กู้เงินสกุลต่างประเทศมีภาระหนี้เพิ่มทันที ธนาคารกลางรายงานว่าทุนสำรองระหว่างประเทศลดลงเร็ว ประชาชนแห่ซื้อเงินตราต่างประเทศและทองคำ ตลาดหุ้นผันผวนหนัก รัฐมนตรีคลังต้องเลือกว่าจะปกป้องค่าเงิน ยอมให้ลอยตัว หรือช่วยประชาชนที่เดือดร้อนก่อน"
conditions: []   # MVP: every card eligible. State-based weights come in v1 (plan's event table).
baseWeight: 1
cooldownQ: 8
ifIgnored:
  - { target: inflation, delta: 3, over_quarters: 4 }
  - { target: gdpGrowth, delta: -0.8, over_quarters: 4 }
  - { target: debt, delta: 3, over_quarters: 4 }
  - { target: "group:business", delta: -8, over_quarters: 3 }
sourceIds: [design.level-scale, paper.gopinath-2010, wdi.GC.DOD.TOTL.GD.ZS, wdi.FP.CPI.TOTL.ZG]
