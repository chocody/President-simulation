    approach: state-led
    titleTh: "ใช้ทุนสำรองพยุงค่าเงินและควบคุมราคาสินค้า"
    descTh: "ธนาคารกลางขายทุนสำรองเพื่อชะลอการอ่อนค่า และรัฐกำหนดเพดานราคาสินค้าจำเป็น ซื้อเวลาได้ระยะสั้น แต่ทุนสำรองหมดเร็วและสินค้าอาจขาดตลาด"
    costHint: L
    affectedGroups: [urban, business]
    evidenceIds: []
    judgment: null
    reviewedBy: null
  - id: b
    approach: market-led
    titleTh: "ปล่อยค่าเงินลอยตัวและขึ้นดอกเบี้ย"
    descTh: "ยอมให้ค่าเงินปรับตัวและขึ้นดอกเบี้ยเพื่อดึงเงินทุนกลับและคุมเงินเฟ้อ ฟื้นความเชื่อมั่นได้เร็วกว่า แต่ราคาสินค้านำเข้าแพงขึ้นและผู้กู้เงินเดือดร้อน"
    costHint: S
