    titleTh: "ช่วยเงินสดครัวเรือนรายได้น้อยและค้ำประกันสินเชื่อผู้ส่งออก"
    descTh: "โอนเงินสดให้ครัวเรือนรายได้น้อยและค้ำประกันสินเชื่อให้ผู้ส่งออกที่ต้องการเงินทุนหมุนเวียน ประคองคนที่เปราะบางที่สุด แต่ไม่แก้ต้นเหตุของค่าเงินและเพิ่มภาระงบประมาณ"
    costHint: M
