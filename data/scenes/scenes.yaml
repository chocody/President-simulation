- id: scene.outcome.critical-failure.1
  trigger: { kind: outcome, outcome: critical_failure }
  textTh: "{measure} ออกมาแย่กว่าที่กลัว ผู้ปฏิบัติงานภาคสนามรายงานปัญหาพร้อมกันหลายแห่ง รัฐมนตรีต้องแถลงขอโทษ"
