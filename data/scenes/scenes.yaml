- id: scene.delta.corruption.up.large.1
  trigger: { kind: delta, target: corruption, direction: up, size: large }
  textTh: "นักข่าวท้องถิ่นเปิดเผยโครงการถนนที่เบิกเงินครบแต่ไม่เห็นผิวถนน ชาวบ้านรวมตัวถ่ายรูปไซต์งานร้าง"
  sourceIds: [design.scenes]
- id: scene.delta.corruption.down.small.1
  trigger: { kind: delta, target: corruption, direction: down, size: small }
  textTh: "ผลตรวจสอบโครงการท้องถิ่นถูกติดประกาศให้ชาวบ้านอ่าน เจ้าหน้าที่ระวังการเบิกจ่ายมากขึ้น"
  sourceIds: [design.scenes, paper.olken-2007]
- id: scene.delta.corruption.down.large.1
  trigger: { kind: delta, target: corruption, direction: down, size: large }
  textTh: "ผู้ตรวจสอบเข้าตรวจหลายโครงการก่อสร้างพร้อมกัน ผลถูกเปิดให้ประชาชนดู ผู้รับเหมาที่เบิกเกินจริงต้องคืนเงิน"
  sourceIds: [design.scenes, paper.olken-2007]
- id: scene.delta.press-freedom.up.small.1
  trigger: { kind: delta, target: pressFreedom, direction: up, size: small }
  textTh: "หนังสือพิมพ์ท้องถิ่นลงข่าวตรวจสอบการใช้งบของเทศบาลโดยไม่ถูกเรียกไปชี้แจง"
  sourceIds: [design.scenes]
- id: scene.delta.press-freedom.up.large.1
  trigger: { kind: delta, target: pressFreedom, direction: up, size: large }
  textTh: "สำนักข่าวหลายแห่งเปิดคอลัมน์วิจารณ์รัฐบาลเต็มหน้า วิทยุชุมชนเปิดสายคุยเรื่องนโยบายทุกเย็นโดยไม่มีใครห้าม"
  sourceIds: [design.scenes]
- id: scene.delta.press-freedom.down.small.1
  trigger: { kind: delta, target: pressFreedom, direction: down, size: small }
  textTh: "บรรณาธิการท้องถิ่นเริ่มตัดข่าวบางเรื่องออกก่อนพิมพ์ เพราะกลัวถูกเรียกไปพบเจ้าหน้าที่"
  sourceIds: [design.scenes]
- id: scene.delta.press-freedom.down.large.1
  trigger: { kind: delta, target: pressFreedom, direction: down, size: large }
  textTh: "สถานีวิทยุชุมชนถูกสั่งปิด นักข่าวหลายคนเงียบ หนังสือพิมพ์ฉบับหนึ่งเหลือข่าวการเมืองบรรทัดเดียว"
  sourceIds: [design.scenes]
- id: scene.delta.stability.up.small.1
  trigger: { kind: delta, target: stability, direction: up, size: small }
  textTh: "ถนนสายหลักไม่มีการชุมนุมติดต่อกันหลายสัปดาห์ ร้านค้าเปิดปิดตามเวลาปกติ"
  sourceIds: [design.scenes]
- id: scene.delta.stability.up.small.2
  trigger: { kind: delta, target: stability, direction: up, size: small }
  textTh: "ผู้นำชุมชนบอกว่าความตึงเครียดในที่ประชุมหมู่บ้านลดลง ข้อพิพาทเล็ก ๆ ไกล่เกลี่ยได้ก่อนบานปลาย"
  sourceIds: [design.scenes]
- id: scene.delta.stability.up.large.1
  trigger: { kind: delta, target: stability, direction: up, size: large }
  textTh: "ตลาดนัดกลางคืนกลับมาเปิดเต็มรูปแบบ คนในพื้นที่และนักท่องเที่ยวเดินกันแน่นถนน ไม่มีใครกังวลเรื่องความวุ่นวาย"
  sourceIds: [design.scenes]
- id: scene.delta.stability.up.large.2
  trigger: { kind: delta, target: stability, direction: up, size: large }
  textTh: "สภาและรัฐบาลทำงานต่อเนื่องไม่มีเหตุวุ่นวายมาหลายเดือน นักลงทุนวางแผนขยายโรงงานโดยไม่ต้องรอดูสถานการณ์"
  sourceIds: [design.scenes]
- id: scene.delta.stability.down.small.1
  trigger: { kind: delta, target: stability, direction: down, size: small }
  textTh: "ข่าวลือเรื่องการชุมนุมใหญ่ทำให้ร้านค้าแถวที่ว่าการปิดเร็วกว่าปกติ"
  sourceIds: [design.scenes]
- id: scene.delta.stability.down.small.2
  trigger: { kind: delta, target: stability, direction: down, size: small }
  textTh: "การถกเถียงในร้านกาแฟและโซเชียลดุเดือดขึ้น เพื่อนบ้านบางคนเลิกคุยเรื่องการเมืองกัน"
  sourceIds: [design.scenes]
- id: scene.delta.stability.down.large.1
  trigger: { kind: delta, target: stability, direction: down, size: large }
  textTh: "ผู้ชุมนุมปิดถนนหน้าสถานที่ราชการ ร้านค้าปิดประตูเหล็ก ตำรวจตั้งแนวกั้น นักท่องเที่ยวยกเลิกห้องพัก"
  sourceIds: [design.scenes]
- id: scene.delta.stability.down.large.2
  trigger: { kind: delta, target: stability, direction: down, size: large }
  textTh: "ความวุ่นวายลามหลายจังหวัด รถประจำทางหยุดวิ่งบางเส้นทาง โรงเรียนประกาศเลื่อนเปิดเทอมออกไปหนึ่งสัปดาห์"
  sourceIds: [design.scenes]
- id: scene.delta.parliament.up.small.1
  trigger: { kind: delta, target: parliament, direction: up, size: small }
  textTh: "ส.ส. ฝ่ายรัฐบาลเข้าประชุมครบองค์ประชุม ร่างกฎหมายผ่านวาระแรกโดยไม่ต้องรอนาน"
  sourceIds: [design.scenes]
- id: scene.delta.parliament.up.large.1
  trigger: { kind: delta, target: parliament, direction: up, size: large }
  textTh: "ร่างกฎหมายสำคัญผ่านสภาด้วยเสียงข้างมากชัดเจน ส.ส. หลายฝ่ายยกมือสนับสนุน ผู้ประสานงานรัฐบาลยิ้มหน้าห้องประชุม"
  sourceIds: [design.scenes]
- id: scene.delta.parliament.down.small.1
  trigger: { kind: delta, target: parliament, direction: down, size: small }
  textTh: "ส.ส. บางคนไม่เข้าประชุม ผู้ประสานงานรัฐบาลต้องโทรตามให้ครบองค์ประชุม"
  sourceIds: [design.scenes]
- id: scene.delta.parliament.down.large.1
  trigger: { kind: delta, target: parliament, direction: down, size: large }
  textTh: "ส.ส. ฝ่ายรัฐบาลหลายคนประกาศไม่ยกมือให้ร่างสำคัญ ผู้ประสานงานรัฐบาลวิ่งหาเสียงสนับสนุนทั้งคืน"
  sourceIds: [design.scenes]
- id: scene.delta.environment.up.small.1
  trigger: { kind: delta, target: environment, direction: up, size: small }
  textTh: "แม่น้ำสายหลักใสขึ้นเล็กน้อย ชาวบ้านริมคลองเห็นปลากลับมาในจุดที่เคยไม่มี"
  sourceIds: [design.scenes]
- id: scene.delta.environment.up.large.1
  trigger: { kind: delta, target: environment, direction: up, size: large }
  textTh: "ฝุ่นละอองลดลงชัดเจน ท้องฟ้าเมืองสว่างขึ้น เด็ก ๆ กลับมาวิ่งเล่นกลางแจ้ง ป่าชุมชนมีต้นไม้งอกใหม่"
  sourceIds: [design.scenes]
- id: scene.delta.environment.down.small.1
  trigger: { kind: delta, target: environment, direction: down, size: small }
  textTh: "กลิ่นเหม็นจากบ่อขยะลอยเข้าหมู่บ้านบางวัน ชาวบ้านร้องเรียนต่อเทศบาล"
  sourceIds: [design.scenes]
- id: scene.delta.environment.down.large.1
  trigger: { kind: delta, target: environment, direction: down, size: large }
  textTh: "ฝุ่นควันปกคลุมเมืองหลายวัน โรงเรียนงดกิจกรรมกลางแจ้ง คลินิกเต็มไปด้วยผู้ป่วยไอและหอบ"
  sourceIds: [design.scenes]
- id: scene.delta.foreign-relations.up.small.1
  trigger: { kind: delta, target: foreignRelations, direction: up, size: small }
  textTh: "ทูตจากประเทศเพื่อนบ้านมาเยี่ยมกระทรวงการต่างประเทศ ข้อตกลงด้านการค้าชายแดนเดินหน้าต่อ"
  sourceIds: [design.scenes]
- id: scene.delta.foreign-relations.up.large.1
  trigger: { kind: delta, target: foreignRelations, direction: up, size: large }
  textTh: "ผู้นำต่างประเทศหลายรายตอบรับคำเชิญเยือน ข้อตกลงการค้าและการศึกษาฉบับใหม่ถูกลงนามหน้ากล้อง"
  sourceIds: [design.scenes]
- id: scene.delta.foreign-relations.down.small.1
  trigger: { kind: delta, target: foreignRelations, direction: down, size: small }
  textTh: "การประชุมกับคู่ค้าต่างประเทศถูกเลื่อน เจ้าหน้าที่กระทรวงต่างประเทศชี้แจงว่าเป็นเรื่องตารางงาน"
  sourceIds: [design.scenes]
- id: scene.delta.foreign-relations.down.large.1
  trigger: { kind: delta, target: foreignRelations, direction: down, size: large }
  textTh: "ทูตของประเทศคู่ค้าถูกเรียกเข้าพบเพื่อประท้วง ผู้ซื้อต่างประเทศเลื่อนสัญญา ผู้ส่งออกกังวลว่าออเดอร์จะหาย"
  sourceIds: [design.scenes]
- id: scene.delta.group-farmers.up.small.1
  trigger: { kind: delta, target: "group:farmers", direction: up, size: small }
  textTh: "ชาวสวนคุยกันในร้านกาแฟหมู่บ้านว่าปีนี้พอมีเงินเหลือเก็บ ผู้ใหญ่บ้านเริ่มพูดถึงรัฐบาลในแง่ดี"
  sourceIds: [design.scenes]
- id: scene.delta.group-farmers.up.small.2
  trigger: { kind: delta, target: "group:farmers", direction: up, size: small }
  textTh: "สหกรณ์การเกษตรเปิดรับซื้อผลผลิตตามราคาที่ตกลงไว้ เกษตรกรไม่ต้องรอพ่อค้าคนกลางเสนอราคา"
  sourceIds: [design.scenes]
- id: scene.delta.group-farmers.up.large.1
  trigger: { kind: delta, target: "group:farmers", direction: up, size: large }
  textTh: "ชาวนาและชาวสวนจัดงานเลี้ยงขอบคุณในหมู่บ้าน เกษตรกรหลายรายวางแผนซื้อเครื่องจักรเพิ่ม"
  sourceIds: [design.scenes]
- id: scene.delta.group-farmers.up.large.2
  trigger: { kind: delta, target: "group:farmers", direction: up, size: large }
  textTh: "ลานรับซื้อผลผลิตคึกคักตลอดวัน เกษตรกรถือใบเสร็จยิ้มแย้ม ตัวแทนกลุ่มเกษตรกรกล่าวขอบคุณต่อหน้าชาวบ้าน"
  sourceIds: [design.scenes]
- id: scene.delta.group-farmers.down.small.1
  trigger: { kind: delta, target: "group:farmers", direction: down, size: small }
  textTh: "ชาวนาพูดกันในร้านน้ำชาว่าต้นทุนปุ๋ยสูงเกินไป กลุ่มแชตเกษตรกรเต็มไปด้วยข้อความบ่น"
  sourceIds: [design.scenes]
- id: scene.delta.group-farmers.down.small.2
  trigger: { kind: delta, target: "group:farmers", direction: down, size: small }
  textTh: "ตัวแทนกลุ่มเกษตรกรยื่นหนังสือถึงนายอำเภอเรื่องราคาผลผลิต ชาวบ้านมาร่วมเซ็นชื่อ"
  sourceIds: [design.scenes]
- id: scene.delta.group-farmers.down.large.1
  trigger: { kind: delta, target: "group:farmers", direction: down, size: large }
  textTh: "เกษตรกรขับรถแทรกเตอร์มาจอดเรียงหน้าที่ว่าการอำเภอ ตัวแทนกลุ่มขู่ปิดถนนหากไม่ได้คำตอบ"
  sourceIds: [design.scenes]
- id: scene.delta.group-farmers.down.large.2
  trigger: { kind: delta, target: "group:farmers", direction: down, size: large }
  textTh: "ชาวนาหลายหมู่บ้านเทผลผลิตกองหน้าสำนักงานเกษตรจังหวัดเพื่อประท้วง ผู้ใหญ่บ้านบอกว่าไม่ไหวแล้ว"
  sourceIds: [design.scenes]
- id: scene.delta.group-urban.up.small.1
  trigger: { kind: delta, target: "group:urban", direction: up, size: small }
  textTh: "คนทำงานในเมืองบ่นเรื่องค่าครองชีพน้อยลง รถไฟฟ้ายังแน่นแต่ผู้โดยสารอารมณ์ดีขึ้น"
  sourceIds: [design.scenes]
- id: scene.delta.group-urban.up.small.2
  trigger: { kind: delta, target: "group:urban", direction: up, size: small }
  textTh: "ร้านกาแฟย่านออฟฟิศมีลูกค้าสั่งเมนูพิเศษเพิ่ม พนักงานนัดสังสรรค์หลังเลิกงานบ่อยขึ้น"
  sourceIds: [design.scenes]
- id: scene.delta.group-urban.up.large.1
  trigger: { kind: delta, target: "group:urban", direction: up, size: large }
  textTh: "คนเมืองเต็มห้างและตลาดนัดตอนเย็นวันศุกร์ โพลบนโซเชียลชี้ว่าคนเมืองมองอนาคตดีขึ้น"
  sourceIds: [design.scenes]
- id: scene.delta.group-urban.up.large.2
  trigger: { kind: delta, target: "group:urban", direction: up, size: large }
  textTh: "พนักงานออฟฟิศและพ่อค้าแม่ค้าในเมืองพูดตรงกันว่าชีวิตดีขึ้น คนต่อคิวดูบ้านใหม่และผ่อนรถมากขึ้น"
  sourceIds: [design.scenes]
- id: scene.delta.group-urban.down.small.1
  trigger: { kind: delta, target: "group:urban", direction: down, size: small }
  textTh: "คนเมืองบ่นเรื่องรถติดและค่าครองชีพในกลุ่มแชต ร้านอาหารมีลูกค้าสั่งกลับบ้านมากกว่านั่งกิน"
  sourceIds: [design.scenes]
- id: scene.delta.group-urban.down.small.2
  trigger: { kind: delta, target: "group:urban", direction: down, size: small }
  textTh: "ผู้โดยสารรถไฟฟ้าบ่นเรื่องค่าโดยสารและความแออัด ร้านกาแฟย่านออฟฟิศเงียบลง"
  sourceIds: [design.scenes]
- id: scene.delta.group-urban.down.large.1
  trigger: { kind: delta, target: "group:urban", direction: down, size: large }
  textTh: "คนเมืองรวมกลุ่มโพสต์ประท้วงค่าครองชีพ ผู้โดยสารรถเมล์เดินเท้ากลับบ้าน ร้านค้าในตัวเมืองติดป้ายขอความเข้าใจ"
  sourceIds: [design.scenes]
- id: scene.delta.group-urban.down.large.2
  trigger: { kind: delta, target: "group:urban", direction: down, size: large }
  textTh: "ผู้เช่าห้องในเมืองรวมตัวหน้าที่ว่าการเขต ยื่นข้อเรียกร้องเรื่องค่าเช่าและความปลอดภัย สื่อถ่ายทอดสดตลอดบ่าย"
  sourceIds: [design.scenes]
- id: scene.delta.group-business.up.small.1
  trigger: { kind: delta, target: "group:business", direction: up, size: small }
  textTh: "สภาหอการค้าประชุมกันด้วยบรรยากาศผ่อนคลาย ผู้ประกอบการเริ่มพูดถึงแผนจ้างงานปีหน้า"
  sourceIds: [design.scenes]
- id: scene.delta.group-business.up.small.2
  trigger: { kind: delta, target: "group:business", direction: up, size: small }
  textTh: "เจ้าของกิจการขนาดกลางลงนามสั่งซื้อเครื่องจักรใหม่ที่เลื่อนมานาน"
  sourceIds: [design.scenes]
- id: scene.delta.group-business.up.large.1
  trigger: { kind: delta, target: "group:business", direction: up, size: large }
  textTh: "นักธุรกิจจัดงานเปิดโรงงานแห่งใหม่ท่ามกลางแขกเหรื่อ สมาคมอุตสาหกรรมออกแถลงสนับสนุนนโยบายรัฐ"
  sourceIds: [design.scenes]
- id: scene.delta.group-business.up.large.2
  trigger: { kind: delta, target: "group:business", direction: up, size: large }
  textTh: "ผู้ประกอบการหลายรายประกาศขยายสาขาและเพิ่มการลงทุนพร้อมกัน ธนาคารเปิดสินเชื่อธุรกิจเพิ่ม งานแสดงสินค้าคนแน่น"
  sourceIds: [design.scenes]
- id: scene.delta.group-business.down.small.1
  trigger: { kind: delta, target: "group:business", direction: down, size: small }
  textTh: "สมาคมผู้ประกอบการส่งจดหมายถึงกระทรวงเรื่องกฎระเบียบใหม่ เจ้าของร้านเริ่มชะลอการลงทุน"
  sourceIds: [design.scenes]
- id: scene.delta.group-business.down.small.2
  trigger: { kind: delta, target: "group:business", direction: down, size: small }
  textTh: "เจ้าของโรงงานขนาดกลางเลื่อนแผนซื้อเครื่องจักรออกไป บอกว่าขอดูสถานการณ์ก่อน"
  sourceIds: [design.scenes]
- id: scene.delta.group-business.down.large.1
  trigger: { kind: delta, target: "group:business", direction: down, size: large }
  textTh: "สภาอุตสาหกรรมประกาศคัดค้านนโยบายรัฐต่อสาธารณะ ผู้ประกอบการหลายรายเลื่อนลงทุน บางรายพูดถึงการย้ายฐานการผลิต"
  sourceIds: [design.scenes]
- id: scene.delta.group-business.down.large.2
  trigger: { kind: delta, target: "group:business", direction: down, size: large }
