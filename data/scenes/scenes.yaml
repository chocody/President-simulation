  sourceIds: [design.scenes]
- id: scene.outcome.partial.2
  trigger: { kind: outcome, outcome: partial }
  textTh: "ผลของ {measure} ออกมาครึ่ง ๆ กลาง ๆ ผู้ได้ประโยชน์พอใจ แต่ผู้ที่ยังไม่ได้รับถามว่าจะถึงตาตนเมื่อไร"
  sourceIds: [design.scenes]
- id: scene.outcome.failure.1
  trigger: { kind: outcome, outcome: failure }
  textTh: "{measure} ไม่ได้ผลตามที่หวัง งบถูกใช้ไปแล้วแต่ชาวบ้านแทบไม่เห็นการเปลี่ยนแปลง ฝ่ายค้านตั้งกระทู้ถาม"
  sourceIds: [design.scenes]
- id: scene.outcome.failure.2
  trigger: { kind: outcome, outcome: failure }
  textTh: "ผู้ปฏิบัติงานรายงานว่า {measure} ติดขัดตั้งแต่เริ่มต้น ปัญหาเดิมยังอยู่ โครงการต้องกลับไปทบทวน"
  sourceIds: [design.scenes]
