- id: scene.outcome.critical-failure.2
  trigger: { kind: outcome, outcome: critical_failure }
  textTh: "ผลของ {measure} ย้อนกลับเข้าตัว หน่วยงานต้องหยุดโครงการกลางทาง ชาวบ้านเดือดร้อนและสื่อรายงานซ้ำทุกวัน"
  sourceIds: [design.scenes]
- id: scene.outcome.great-success.1
  trigger: { kind: outcome, outcome: great_success }
  textTh: "{measure} ได้ผลเกินคาด ผู้ปฏิบัติงานภาคสนามรายงานว่าชาวบ้านได้ประโยชน์เร็วกว่ากำหนด รัฐมนตรีเปิดแถลงข่าวด้วยรอยยิ้ม"
