# D5 consequence scenes: Thai situation templates the engine picks after each decision and when delayed effects arrive.
# One or two short sentences each; no digits, country or city names, real people or party names; officials are roles.
# Delta scenes describe typical, well-documented mechanisms (never one historical event); direction follows the real meaning
# (inflation, unemployment, crime, corruption, inequality and debt up are bad; budget down is less fiscal room); large is visibly bigger than small.
# Every key target x up/down x small/large has at least one plain (no traitWeights) template, so the engine always has a fallback.
# {measure} (the measure title) is used in outcome, protest and court templates only.
# sourceIds: design.scenes everywhere; a research source only where that study documents the mechanism in the text.
# traitWeights: only where the country trait (see TRAITS in design-params) makes the link plain.

# ---- delta scenes ----
