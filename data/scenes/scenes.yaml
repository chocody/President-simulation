  trigger: { kind: court }
  textTh: "ศาลปกครองสั่งระงับ {measure} ชั่วคราวหลังมีผู้ร้อง เจ้าหน้าที่ต้องหยุดงานภาคสนามและรอคำวินิจฉัยฉบับเต็ม"
